<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TANMAY - Create Account</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(#000b,#000b),url('/static/backgrounds/freefire.jpeg') center/cover fixed;color:#fff;font-family:"Courier New",monospace}.card{width:min(430px,92vw);padding:30px;border:2px solid #63ff00;border-radius:24px;background:#030703e8;box-shadow:0 0 35px #63ff0055}.logo{width:78px;height:78px;margin:0 auto 12px;border-radius:50%;object-fit:cover;border:2px solid #63ff00;box-shadow:0 0 22px #63ff00}.brand{text-align:center;font:800 38px Arial;letter-spacing:4px}.brand span{color:#63ff00}.sub{text-align:center;color:#63ff00;letter-spacing:4px;margin:12px 0 28px}.input{width:100%;height:54px;margin:8px 0;padding:0 16px;border:1px solid #63ff00;border-radius:12px;background:#000b;color:#fff;font:16px "Courier New"}.btn{width:100%;height:58px;margin-top:14px;border:0;border-radius:12px;background:#63ff00;color:#031000;font-weight:800;letter-spacing:3px}.err{padding:10px;border:1px solid #f55;color:#f88;border-radius:8px;margin-bottom:12px;text-align:center}.back{text-align:center;margin-top:18px}.back a{color:#63ff00}</style></head><body><main class="card"><img class="logo" src="/static/backgrounds/freefire.jpeg"><div class="brand">TAN<span>MAY</span></div><div class="sub">CREATE ACCOUNT</div>{% if error %}<div class="err">{{error}}</div>{% endif %}<form method="post"><input class="input" name="username" placeholder="Username" required><input class="input" type="email" name="email" placeholder="Email" required><input class="input" type="password" name="password" placeholder="Password" required><input class="input" type="password" name="confirm_password" placeholder="Confirm Password" required><button class="btn">CREATE ACCOUNT</button></form><div class="back">Already have an account? <a href="/login">Sign In</a></div></main></body></html>
