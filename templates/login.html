<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TANMAY - Login</title><style>
:root{--g:#63ff00}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"Courier New",monospace;color:#fff}body{min-height:100vh;display:grid;place-items:center;padding:18px;background:linear-gradient(rgba(0,0,0,.70),rgba(0,0,0,.82)),url('/static/backgrounds/freefire.jpeg') center/cover fixed no-repeat}.card{width:min(420px,94vw);padding:30px 28px;border:2px solid var(--g);border-radius:28px;background:rgba(2,5,2,.80);backdrop-filter:blur(7px);box-shadow:0 0 30px #63ff0066,0 0 90px #63ff0022}.logo{width:82px;height:82px;display:block;margin:0 auto 14px;border-radius:50%;object-fit:cover;border:2px solid var(--g);box-shadow:0 0 24px #63ff00}.brand{text-align:center;font:800 42px Arial;letter-spacing:5px}.brand span{color:var(--g)}.sub{text-align:center;color:var(--g);letter-spacing:4px;margin:12px 0 30px}.label{color:#aaa;letter-spacing:2px;font-size:12px;margin-top:14px}.input{width:100%;height:58px;margin-top:7px;padding:0 16px;border:2px solid #3da800;border-radius:14px;background:#0009;color:#fff;outline:0;font:16px "Courier New"}.input:focus{border-color:var(--g);box-shadow:0 0 18px #63ff0038}.btn{width:100%;height:62px;margin-top:22px;border:2px solid var(--g);border-radius:13px;background:linear-gradient(#79ff1b,#47e800);color:#061000;font:800 16px "Courier New";letter-spacing:4px}.create{text-align:center;margin-top:22px;color:#aaa}.create a{color:var(--g);font-weight:700}.admin{text-align:center;margin-top:15px}.admin a{color:#777;font-size:12px}.err{margin:12px 0;padding:10px;border:1px solid #f44;color:#ff8585;border-radius:8px;text-align:center}</style></head><body><main class="card"><img class="logo" src="/static/backgrounds/freefire.jpeg" alt="TANMAY"><div class="brand">TAN<span>MAY</span></div><div class="sub">SECURE TERMINAL</div>{% if error %}<div class="err">{{error}}</div>{% endif %}<form method="post" action="/login"><div class="label">USERNAME OR EMAIL</div><input class="input" name="identifier" placeholder="Enter username or email" required autofocus autocomplete="username"><div class="label">PASSWORD</div><input class="input" type="password" name="password" placeholder="Enter password" required autocomplete="current-password"><button class="btn">&gt;_ &nbsp; SIGN IN</button></form><div class="create">New here? <a href="/register">CREATE ACCOUNT</a></div>{% if session.get('is_secret') %}<div class="admin"><a href="/admin">🛡 MASTER ADMIN PANEL</a></div>{% endif %}</main></body></html>
